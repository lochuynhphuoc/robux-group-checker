<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ro-Check Admin Dashboard</title>
  <link rel="icon" type="image/png" href="/favicon_admin.png?">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b; --card-bg: rgba(24, 24, 27, 0.7); --input-bg: rgba(0, 0, 0, 0.5);
      --border: rgba(255, 190, 220, 0.16); --primary: #ff9fc8; --primary-hover: #ffc0da;
      --danger: #ef4444; --text: #f8fafc; --text-muted: #b5a5ae;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); background-image: radial-gradient(circle at 50% 0%, #3a172b 0%, var(--bg) 60%); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; padding: clamp(16px, 6vw, 40px) clamp(12px, 4vw, 20px); overflow-x: hidden; }
    .wrap { max-width: 900px; margin: 0 auto; }
    
    .card { background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 20px; padding: clamp(18px, 5vw, 30px); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    .login-wrap { max-width: 450px; margin: 10vh auto 0; }
    
    .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .header-actions h1 { margin: 0; font-weight: 800; font-size: 28px; background: linear-gradient(to right, #fff, #ffc0da); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .btn-action { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.1); color: #fff; padding: 10px 16px; font-size: 14px; border-radius: 10px; border: 1px solid var(--border); cursor: pointer; transition: 0.2s; font-weight: 600; text-decoration: none;}
    .btn-action:hover { background: rgba(255,255,255,0.2); }
    
    h1.center { text-align: center; margin: 0 0 25px; font-weight: 800; font-size: 28px; background: linear-gradient(to right, #fff, #ffc0da); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    input { width: 100%; background: var(--input-bg); color: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 14px; font-size: 15px; margin-bottom: 15px; outline: none; transition: border 0.3s; }
    input:focus { border-color: var(--primary); }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 50px; }
    .password-toggle { position: absolute; top: 0; right: 0; width: 48px; height: 48px; padding: 0; margin: 0; background: transparent; color: var(--text-muted); border-radius: 12px; }
    .password-toggle:hover:not(:disabled) { background: transparent; color: #fff; transform: none; }
    .password-toggle svg { width: 19px; height: 19px; }
    
    button { display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; background: var(--primary); color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; }
    button:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-1px); }
    button:disabled { opacity: 0.8; cursor: not-allowed; }
    
    #dashboard { display: none; }
    
    .add-group-box { display: flex; gap: 10px; margin-bottom: 30px; }
    .add-group-box input { margin-bottom: 0; }
    .add-group-box button { width: 160px; margin-bottom: 0; }

    .group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    
    .group-card { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.03); padding: 12px; padding-right: 15px; border-radius: 16px; border: 1px solid var(--border); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
    .group-card:hover { background: rgba(255, 159, 200, 0.08); border-color: var(--primary); transform: translateY(-4px) scale(1.02); box-shadow: 0 15px 30px -10px rgba(0,0,0,0.6), 0 0 15px rgba(255, 159, 200, 0.22); }
    
    .group-icon { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; background: #000; flex-shrink: 0; margin-right: 15px;}
    
    .group-info { display: flex; flex-direction: column; overflow: hidden; flex: 1; }
    .group-name { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; color: #fff;}
    .group-owner { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
    
    .owner-link { color: #ffb7d4; text-decoration: none; font-weight: 600; transition: color 0.2s; }
    .owner-link:hover { color: #fff; text-decoration: underline; }
    .loading-text { color: #facc15; animation: pulse 1.5s infinite; }
    
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .spinner-svg { animation: spin 1s linear infinite; }

    .group-id-text { font-size: 11px; color: var(--text-muted); font-family: monospace; }
    
    .btn-delete { width: 36px; height: 36px; padding: 0; margin-left: 10px; border-radius: 10px; background: rgba(239, 68, 68, 0.15); color: var(--danger); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: 0.2s; }
    .btn-delete:hover { background: var(--danger); color: #fff; transform: scale(1.1); }

    @media (max-width: 640px) {
      .header-actions { align-items: stretch; flex-direction: column; gap: 16px; }
      .header-actions h1 { font-size: 24px; }
      .header-actions > div { display: grid !important; grid-template-columns: 1fr 1fr; gap: 8px !important; }
      .header-actions .btn-action { justify-content: center; padding: 10px 8px; }
      .add-group-box { flex-direction: column; gap: 8px; }
      .add-group-box input { min-width: 0; }
      .add-group-box button { width: 100%; }
      .group-grid { grid-template-columns: 1fr; gap: 12px; }
      .group-card { min-width: 0; }
      .group-icon { width: 50px; height: 50px; margin-right: 10px; }
      .btn-delete { margin-left: 8px; }
    }

    @media (hover: none) {
      .group-card:hover { transform: none; box-shadow: none; }
      button:hover:not(:disabled) { transform: none; }
    }

    /* Shared Ro-Check visual system */
    :root {
      --bg: #08070a; --card-bg: rgba(22, 14, 20, 0.94); --input-bg: #100b0f;
      --border: rgba(255, 190, 220, 0.16); --primary: #ff9fc8; --primary-hover: #ffc0da;
      --danger: #ff927e; --text: #f1f5e9; --text-muted: #92a095;
    }
    body { background-color: var(--bg); background-image: linear-gradient(115deg, rgba(10,5,9,.9), rgba(39,8,28,.72)), url('https://images.unsplash.com/photo-1654331046188-a73586da7ed6?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D'); background-size: cover; background-position: center; background-attachment: fixed; font-family: 'DM Sans', sans-serif; padding: 32px 24px 70px; }
    .wrap { max-width: 1100px; }
    .card { background: transparent; backdrop-filter: none; border: none; border-radius: 0; box-shadow: none; }
    .login-wrap { max-width: 480px; margin: 12vh auto 0; padding: 42px; }
    .admin-eyebrow { display: flex; align-items: center; gap: 9px; color: var(--primary); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 14px; }
    .admin-eyebrow span { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 0 5px rgba(255,159,200,.14); }
    h1.center, .header-actions h1 { font-family: 'Space Grotesk', sans-serif; background: none; -webkit-text-fill-color: initial; color: var(--text); letter-spacing: -.05em; }
    h1.center { font-size: 42px; text-align: left; margin-bottom: 28px; }
    input { background: var(--input-bg); border-color: var(--border); color: var(--text); border-radius: 13px; }
    input::placeholder { color: #8f7d88; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(255,159,200,.12); }
    button:not(.btn-action):not(.password-toggle) { background: var(--primary); color: #28131e; border-radius: 13px; box-shadow: 0 10px 24px rgba(255,159,200,.2); }
    button:hover:not(:disabled):not(.password-toggle) { background: var(--primary-hover); }
    .btn-action { background: rgba(255,255,255,.045); color: #dec4d1; border-color: var(--border); border-radius: 10px; }
    .btn-action:hover { background: rgba(255,92,170,.1); color: var(--primary); border-color: rgba(255,92,170,.38); }
    .password-toggle { color: var(--text-muted); box-shadow: none !important; }
    .password-toggle:hover:not(:disabled) { color: var(--primary); }
    #dashboard { padding: 30px; }
    .header-actions { align-items: flex-end; margin-bottom: 28px; }
    .header-actions .admin-eyebrow { margin-bottom: 8px; }
    .header-actions h1 { font-size: 32px; margin: 0; }
    .add-group-box { background: rgba(18,9,15,.48); backdrop-filter: blur(16px); border: 1px solid rgba(255,159,200,.22); border-radius: 16px; padding: 12px; margin-bottom: 28px; }
    .add-group-box input { border: none; background: transparent; margin: 0; }
    .add-group-box input:focus { box-shadow: none; }
    .add-group-box button { width: 150px; margin: 0; transition: background .2s, border-color .2s, box-shadow .2s, transform .2s; }
    .add-group-box button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(255, 159, 200, .22); }
    .group-card { background: rgba(31,15,26,.58); backdrop-filter: blur(14px); border-color: rgba(255,190,220,.2); border-radius: 14px; }
    .group-card { border-right-color: rgba(255,159,200,.2); }
    .group-card:hover { background: rgba(50,18,36,.9); border-color: rgba(255,159,200,.32); box-shadow: 0 14px 30px rgba(0,0,0,.2); }
    .group-name { font-family: 'Space Grotesk', sans-serif; }
    .group-icon { border-radius: 11px; }
    .owner-link { color: var(--primary); }
    .btn-delete { background: rgba(255,146,126,.1); color: var(--danger); }
    .btn-delete:hover { background: var(--danger); }

    @media (max-width: 640px) {
      body { padding: 16px 12px 50px; }
      .login-wrap { margin-top: 8vh; padding: 28px 20px; }
      h1.center { font-size: 36px; }
      #dashboard { padding: 20px 14px; }
      .header-actions { align-items: stretch; }
      .header-actions h1 { font-size: 28px; }
      .add-group-box { padding: 10px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card login-wrap" id="login-card">
      <div class="admin-eyebrow"><span></span> Secure control room</div>
      <h1 class="center">Admin Portal</h1>
      <div class="password-wrap">
        <input type="password" id="admin-pass" placeholder="Enter Administrator Password" onkeydown="if(event.key==='Enter') login()">
        <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password" title="Show password" onclick="togglePassword()">
          <svg id="password-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
      
      <button id="btn-login" onclick="login()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
        <span>Access Database</span>
      </button>

      <div style="text-align: center; margin-top: 15px;">
        <a href="/" class="btn-action" style="border: none; background: transparent; color: var(--text-muted);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          Back to Homepage
        </a>
      </div>
    </div>

    <div class="card" id="dashboard">
      <div class="header-actions">
        <div>
          <div class="admin-eyebrow"><span></span> Workspace settings</div>
          <h1>Group Manager</h1>
        </div>
        <div style="display: flex; gap: 10px;">
          <a href="/" class="btn-action">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Home
          </a>
          <button onclick="logout()" class="btn-action" style="background: rgba(239, 68, 68, 0.1); color: var(--danger); border-color: rgba(239, 68, 68, 0.2);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            Logout
          </button>
        </div>
      </div>
      
      <div class="add-group-box">
        <input type="text" id="new-group" placeholder="Paste Group ID or full Roblox Link here..." onkeydown="if (event.key === 'Enter') addGroup()">
        <button id="btn-add" onclick="addGroup()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Add Group
        </button>
      </div>

      <div class="group-grid" id="list"></div>
    </div>
  </div>

  <script>
    let pass = "";
    function openGroup(e, id) {
      if (e.target.closest('a') || e.target.closest('button')) return;
      
      const a = document.createElement('a');
      a.href = `https://www.roblox.com/communities/${id}`;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.click();
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedPass = sessionStorage.getItem('admin_pass');
      if (savedPass) {
        document.getElementById('admin-pass').value = savedPass;
        login();
      }
    });

    function logout() {
      sessionStorage.removeItem('admin_pass');
      location.reload();
    }

    function togglePassword() {
      const input = document.getElementById('admin-pass');
      const toggle = document.getElementById('password-toggle');
      const eye = document.getElementById('password-eye');
      const isHidden = input.type === 'password';

      input.type = isHidden ? 'text' : 'password';
      toggle.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
      toggle.title = isHidden ? 'Hide password' : 'Show password';
      eye.innerHTML = isHidden
        ? '<path d="M3 3l18 18"></path><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18.5 18.5 0 0 1-3.1 4.1"></path><path d="M6.6 6.6C3.6 8.5 2 12 2 12s3.5 7 10 7c1.2 0 2.3-.2 3.3-.6"></path>'
        : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle>';
    }

    async function fetchAdmin(action, groupId = null) {
      const res = await fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pass, action, groupId }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      return data;
    }

    async function login() {
      const btn = document.getElementById('btn-login');
      pass = document.getElementById('admin-pass').value;
      if (!pass) return;

      const defaultHtml = btn.innerHTML;
      btn.innerHTML = `<svg class="spinner-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 2v4"></path><path d="M12 18v4"></path><path d="M4.93 4.93l2.83 2.83"></path><path d="M16.24 16.24l2.83 2.83"></path><path d="M2 12h4"></path><path d="M18 12h4"></path></svg> <span>Authenticating...</span>`;
      btn.disabled = true;

      try {
        const data = await fetchAdmin('get');
        sessionStorage.setItem('admin_pass', pass);
        document.getElementById('login-card').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        await renderList(data.groupIds);
      } catch (e) { 
        btn.style.background = "var(--danger)";
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> <span>${e.message}</span>`;
        setTimeout(() => {
          btn.style.background = "";
          btn.innerHTML = defaultHtml;
          btn.disabled = false;
        }, 2000);
      }
    }

    async function addGroup() {
      const input = document.getElementById('new-group').value;
      const match = input.match(/\d+/);
      const btn = document.getElementById('btn-add');
      const defaultHtml = btn.innerHTML;
      
      if (!match) { 
        btn.style.background = "var(--danger)"; btn.innerHTML = "Invalid ID"; 
        setTimeout(() => { btn.style.background = ""; btn.innerHTML = defaultHtml; }, 2000);
        return; 
      }
      
      try {
        btn.innerHTML = `<svg class="spinner-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 2v4"></path></svg> Adding...`;
        btn.disabled = true;
        const data = await fetchAdmin('add', match[0]);
        document.getElementById('new-group').value = "";
        
        btn.style.background = "#f2a9c8";
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg> Added!`;
        await renderList(data.groupIds);
        setTimeout(() => { btn.style.background = ""; btn.innerHTML = defaultHtml; btn.disabled = false; }, 2000);
      } catch (e) { 
        btn.style.background = "var(--danger)"; btn.innerHTML = "Error!";
        setTimeout(() => { btn.style.background = ""; btn.innerHTML = defaultHtml; btn.disabled = false; }, 2000);
      }
    }

    async function removeGroup(id) {
      if (!confirm(`Are you sure you want to remove Group ID ${id}?`)) return;
      try {
        const data = await fetchAdmin('remove', id);
        await renderList(data.groupIds);
      } catch (e) { alert(e.message); }
    }

    async function renderList(ids) {
      const list = document.getElementById('list');
      if (ids.length === 0) {
        list.innerHTML = `<div style="grid-column: 1 / -1; text-align:center; color: var(--text-muted); padding: 40px 0;">Database is empty. Add a group to get started!</div>`; return;
      }
      list.innerHTML = `<div style="grid-column: 1 / -1; text-align:center; color: var(--text-muted);">Loading groups...</div>`;
      
      try {
        const idsParam = ids.join(',');
        const [infoRes, iconRes] = await Promise.all([
          fetch(`https://groups.roproxy.com/v2/groups?groupIds=${idsParam}`),
          fetch(`https://thumbnails.roproxy.com/v1/groups/icons?groupIds=${idsParam}&size=150x150&format=Png&isCircular=false`)
        ]);
        const infoData = await infoRes.json();
        const iconData = await iconRes.json();
        
        const groupMap = {}; if (infoData.data) infoData.data.forEach(g => groupMap[g.id] = g);
        const iconMap = {}; if (iconData.data) iconData.data.forEach(i => iconMap[i.targetId] = i.imageUrl);

        const crownSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="2 4 6 16 18 16 22 4 17 9 12 4 7 9"></polygon><line x1="6" y1="19" x2="18" y2="19"></line></svg>`;

        list.innerHTML = ids.map(id => {
          const g = groupMap[id];
          const name = g ? g.name : "Unknown Group";
          
          let ownerHtml = `${crownSvg} <span style="color: var(--text-muted)">No Owner</span>`;
          if (g && g.owner && g.owner.id) {
            ownerHtml = `${crownSvg} <span data-owner="${g.owner.id}" class="loading-text">Loading... ⏳</span>`;
          }

          const imgUrl = iconMap[id] || "https://tr.rbxcdn.com/default-group-icon";

          return `
            <div class="group-card" onclick="openGroup(event, '${id}')" title="Open Group">
              <img src="${imgUrl}" alt="Group Icon" class="group-icon">
              <div class="group-info">
                <div class="group-name">${name}</div>
                <div class="group-owner">${ownerHtml}</div>
                <div class="group-id-text">ID: ${id}</div>
              </div>
              <button class="btn-delete" onclick="event.stopPropagation(); removeGroup('${id}')" title="Remove Group">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg>
              </button>
            </div>
          `;
        }).join('');

        const uniqueOwnerIds = [...new Set(ids.map(id => groupMap[id]?.owner?.id).filter(Boolean))];
        
        fetchOwnersInBackground(uniqueOwnerIds); 
      } catch (err) {
        list.innerHTML = `<div style="grid-column: 1 / -1; color: var(--danger); text-align:center;">Failed to load Roblox details: ${err.message}</div>`;
      }
    }

    async function fetchOwnersInBackground(ownerIds) {
      for (let i = 0; i < ownerIds.length; i++) {
        const uid = ownerIds[i];
        try {
          const res = await fetch(`https://users.roproxy.com/v1/users/${uid}`);
            let finalHtml = `<a href="https://www.roblox.com/users/${uid}/profile" target="_blank" class="owner-link" onclick="event.stopPropagation()">User ID: ${uid}</a>`;
            if (res.ok) {
            const u = await res.json();
            const oName = u.displayName || u.name;
            finalHtml = `<a href="https://www.roblox.com/users/${uid}/profile" target="_blank" class="owner-link" onclick="event.stopPropagation()">${oName}</a>`;
          }
          document.querySelectorAll(`span[data-owner="${uid}"]`).forEach(el => {
            el.outerHTML = finalHtml; 
          });
        } catch (e) {}
        if (i < ownerIds.length - 1) await new Promise(r => setTimeout(r, 400));
      }
    }
  </script>
