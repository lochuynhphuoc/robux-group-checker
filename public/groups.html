<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Groups Manager - Ro-Check</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root { --bg:#080608; --card:rgba(32,16,28,.78); --border:rgba(255,159,200,.2); --text:#f3eaf0; --muted:#b7a9b2; --pink:#ff9fc8; --danger:#ff9a8b; }
    * { box-sizing:border-box; } body { min-height:100vh; margin:0; padding:24px; color:var(--text); font:14px 'DM Sans',Arial,sans-serif; background:radial-gradient(ellipse at 50% -20%,#482038 0%,var(--bg) 58%); }
    .wrap { width:min(100%,760px); margin:40px auto; } .top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; }
    a { color:var(--pink); text-decoration:none; } .card { padding:28px; border:1px solid var(--border); border-radius:20px; background:var(--card); box-shadow:0 24px 70px rgba(0,0,0,.4); }
    h1 { margin:0 0 8px; font-size:32px; } .intro { margin:0 0 24px; color:var(--muted); line-height:1.55; }
    label { display:block; margin:14px 0 7px; color:var(--muted); font-size:12px; font-weight:700; } input, textarea { width:100%; padding:12px; border:1px solid var(--border); border-radius:10px; color:var(--text); background:rgba(0,0,0,.32); font:inherit; } textarea { min-height:150px; resize:vertical; }
    input:focus, textarea:focus { outline:0; border-color:var(--pink); } .actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; } button { padding:11px 16px; border:1px solid var(--border); border-radius:10px; color:var(--pink); background:rgba(255,159,200,.1); font:inherit; font-weight:700; cursor:pointer; } button.primary { color:#28131e; background:var(--pink); }
    button:disabled { opacity:.6; cursor:wait; } .message { min-height:22px; margin:16px 0 0; color:var(--muted); } .message.error { color:var(--danger); } .message.success { color:var(--pink); }
    .list { margin-top:24px; display:grid; gap:10px; } .list-item { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:13px; border:1px solid var(--border); border-radius:10px; } .list-item small { color:var(--muted); }
    @media(max-width:560px) { body { padding:16px; } .wrap { margin:20px auto; } .card { padding:20px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top"><a href="/">← Homepage</a><a href="/account.html">Account</a></div>
    <section class="card">
      <h1>Groups Manager</h1>
      <p class="intro">Save verified Roblox groups to your account. Links or numeric IDs are accepted; every group is checked against Roblox before saving.</p>
      <form id="group-form">
        <label for="name">List name</label>
        <input id="name" maxlength="40" placeholder="e.g. My payout groups" required>
        <label for="groups">Group links or IDs</label>
        <textarea id="groups" placeholder="https://www.roblox.com/communities/123456&#10;987654"></textarea>
        <div class="actions"><button type="button" id="validate">Validate groups</button><button class="primary" type="submit">Save verified list</button></div>
      </form>
      <p id="message" class="message"></p>
      <div id="lists" class="list"></div>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    let user = null;
    function readIds() {
      const entries = $('groups').value.trim().split(/[\s,;]+/).filter(Boolean);
      const ids = entries.map(entry => {
        const match = /^\d+$/.test(entry) ? entry : entry.match(/^(?:https?:\/\/)?(?:www\.)?roblox\.com\/(?:groups|communities)\/(\d+)(?:[/?#].*)?$/i);
        return match ? Number(match[1] || match[0]) : NaN;
      });
      if (!ids.length || ids.some(id => !Number.isSafeInteger(id) || id <= 0)) throw new Error('Enter valid Roblox group links or IDs.');
      if (ids.length > 100) throw new Error('Maximum 100 groups per list.');
      return [...new Set(ids)];
    }
    async function json(response) { const text = await response.text(); try { return JSON.parse(text); } catch { throw new Error(`Unexpected server response (${response.status}).`); } }
    async function request(action, body) {
      const response = await fetch(`/api/auth?action=${action}`, { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
      const data = await json(response); if (!response.ok) throw new Error(data.error || 'Request failed.'); return data;
    }
    function show(data, success = false) { $('message').className = `message ${success ? 'success' : 'error'}`; $('message').textContent = data; }
    async function validate() {
      try { const data = await request('validate-groups', { groupIds:readIds() }); show(`Verified ${data.valid.length} group(s): ${data.valid.map(group => `${group.name} (${group.id})`).join(', ')}`, true); } catch (error) { show(error.message); }
    }
    $('validate').onclick = validate;
    $('group-form').onsubmit = async event => {
      event.preventDefault();
      try { const data = await request('save-list', { name:$('name').value.trim(), groupIds:readIds() }); user = data.user; show('List saved successfully.', true); render(); } catch (error) { show(error.message); }
    };
    async function load() {
      try { const response = await fetch('/api/auth?action=me', { credentials:'same-origin' }); const data = await json(response); if (!data.user) { location.href='/account.html'; return; } user=data.user; render(); } catch (error) { show(error.message); }
    }
    function render() { $('lists').innerHTML = (user.lists || []).map(list => `<div class="list-item"><span><strong>${list.name}</strong><br><small>${list.groupIds.length} verified group(s)</small></span><button onclick="removeList('${list.id}')">Delete</button></div>`).join('') || '<small>No saved lists yet.</small>'; }
    async function removeList(id) { try { const data = await request('delete-list', { listId:id }); user=data.user; render(); } catch (error) { show(error.message); } }
    load();
  </script>
</body>
</html>
