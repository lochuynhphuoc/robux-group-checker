<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roblox Group Checker - ez</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505; --card-bg: rgba(17, 24, 39, 0.35); --input-bg: rgba(0, 0, 0, 0.4);
      --border: rgba(255, 255, 255, 0.08); --border-focus: #58a6ff;
      --text: #e5e7eb; --text-muted: #9ca3af;
      --primary: #ff9fc8; --primary-hover: #ffc0da; --primary-glow: rgba(255, 159, 200, 0.24);
      --success: #f2a9c8; --success-bg: rgba(255, 159, 200, 0.1);
      --danger: #ef4444; --danger-bg: rgba(239, 68, 68, 0.1);
      --warning: #f59e0b; --warning-bg: rgba(245, 158, 11, 0.1);
    }
    
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #4b5563; }

    * { box-sizing: border-box; }
    body { margin: 0; background-color: var(--bg); background-image: radial-gradient(ellipse at 50% -20%, #3a172b 0%, var(--bg) 50%); background-attachment: fixed; color: var(--text); font-family: 'Inter', sans-serif; line-height: 1.5; padding: 0 clamp(12px, 4vw, 20px) 60px; overflow-x: hidden; }
    .wrap { max-width: 1100px; margin: 0 auto; padding-top: 30px; }
    
    .input-card { background: var(--card-bg); backdrop-filter: blur(30px); border: 1px solid var(--border); border-radius: 24px; padding: clamp(20px, 5vw, 40px); box-shadow: 0 20px 40px rgba(0,0,0,0.3); transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); margin-bottom: 25px; }
    .input-card.compact { padding: 15px 25px; border-radius: 16px; background: rgba(17, 24, 39, 0.5); }
    
    .header-text { text-align: center; margin-bottom: 30px; transition: all 0.4s ease; overflow: hidden; opacity: 1; }
    .header-text h1 { margin: 0; font-size: 38px; font-weight: 800; letter-spacing: -1px; background: linear-gradient(135deg, #fff 0%, #ffc0da 100%); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-text p { color: var(--text-muted); margin: 8px 0 0; font-size: 16px; }
    .input-card.compact .header-text { max-height: 0; margin-bottom: 0; opacity: 0; transform: translateY(-10px) scale(0.95); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 15px; align-items: end; transition: all 0.4s ease; }
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    .input-group label { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; color: #e5e7eb; transition: all 0.3s; }
    .badge { font-size: 10px; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 12px; color: var(--text-muted); font-weight: 500; text-transform: uppercase;}
    .input-card.compact .input-group label { font-size: 12px; margin-bottom: -2px; color: var(--text-muted); }
    .input-card.compact .badge { display: none; }

    .input-wrapper { position: relative; display: flex; align-items: center; }
    
    .form-row input { height: 52px; width: 100%; background: var(--input-bg); color: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 0 40px 0 18px; font-size: 15px; font-family: inherit; transition: all 0.3s; }
    .form-row input:focus { outline: none; border-color: var(--border-focus); background: rgba(0, 0, 0, 0.6);}
    
    .input-card.compact .form-row input { height: 45px; padding: 0 35px 0 16px; font-size: 14px; }

    .clear-btn { position: absolute; right: 10px; background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; display: none; align-items: center; justify-content: center; border-radius: 50%; transition: 0.2s; }
    .clear-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }

    .btn-check { height: 52px; min-width: 150px; background: linear-gradient(135deg, var(--primary), #ffb7d4); color: #28131e; border: none; border-radius: 12px; padding: 0 25px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; display: inline-flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 8px 15px var(--primary-glow); }
    .btn-check:hover { transform: translateY(-2px); box-shadow: 0 12px 20px var(--primary-glow); filter: brightness(1.1); }
    .btn-check:disabled { opacity: 0.7; cursor: not-allowed; transform: none; box-shadow: none; filter: grayscale(0.5); }
    
    .input-card.compact .btn-check { height: 45px; padding: 0 20px; font-size: 14px;}

    .sticky-profile { position: sticky; top: 15px; z-index: 999; }
    .user-profile { display: flex; align-items: center; gap: 15px; padding: 12px 25px; background: rgba(17, 24, 39, 0.55); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); animation: fadeInProfile 0.4s ease-out; margin-bottom: 20px; }
    @keyframes fadeInProfile { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .user-profile img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #ff9fc8; }
    .user-profile .u-name { font-size: 18px; font-weight: 800; color: #fff; margin: 0; }
    .user-profile .u-id { color: var(--text-muted); font-size: 13px; margin: 2px 0 0; font-weight: 500; }

    .result-container { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    
    .search-box { position: relative; margin-bottom: 25px; }
    .search-box input { width: 100%; padding: 14px 15px 14px 45px; border-radius: 14px; background: rgba(0,0,0,0.35); border: 1px solid var(--border); color: #fff; font-size: 15px; outline: none; transition: 0.3s; }
    .search-box input:focus { border-color: var(--primary); background: rgba(0,0,0,0.6); }
    .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

    .summary { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 25px; }
    .pill { padding: 10px 20px; border-radius: 999px; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); cursor: pointer; backdrop-filter: blur(10px); }
    .pill:hover { transform: translateY(-3px); filter: brightness(1.15); }
    .pill.ok { background: rgba(255, 159, 200, 0.12); color: var(--success); border: 1px solid rgba(255, 159, 200, 0.3); }
    .pill.no { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
    
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    
    .group-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; align-items: flex-start; gap: 14px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); text-decoration: none; color: inherit; position: relative; overflow: hidden; cursor: pointer; }
    .group-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; border-radius: 16px 0 0 16px; background: transparent; transition: 0.3s; }
    .group-card.is-joined::before { background: var(--success); }
    .group-card.not-joined::before { background: var(--danger); }
    .group-card:hover { border-color: rgba(255,255,255,0.15); transform: translateY(-4px); background: rgba(255,255,255,0.08); }
    .group-card img { width: 55px; height: 55px; border-radius: 12px; object-fit: cover; background: rgba(0,0,0,0.5); }
    .group-card .g-info { flex: 1; min-width: 0; overflow: hidden; display: flex; flex-direction: column; gap: 4px; }
    .group-card .g-name { font-weight: 700; color: #fff; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px;}
    .g-name .name-text { display: inline-block; white-space: nowrap; }
    .group-card:hover .g-name.is-marquee .name-text { animation: name-marquee 10s ease-in-out infinite; }
    .group-card .g-meta { font-size: 12px; color: var(--text-muted); font-weight: 500;}
    
    .g-payout { font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 6px; width: fit-content; max-width: 100%; margin-top: 6px;}
    .g-payout.ok { background: rgba(77, 190, 119, 0.12); color: #8fe3ad; border: 1px solid rgba(143, 227, 173, 0.3); }
    .g-payout.wait { background: var(--warning-bg); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
    
    .join-now { color: #ffb7d4; font-weight: 700; display: inline-block; margin-top: 6px; padding: 4px 10px; background: rgba(255, 159, 200, 0.1); border-radius: 6px; }
    .icon-ok { color: var(--success); font-weight: 900; }
    .icon-no { color: var(--danger); font-weight: 900; }
    
    .warning-box, .error-box { padding: 16px 20px; border-radius: 12px; margin-bottom: 25px; font-size: 15px; font-weight: 500; display: flex; gap: 10px; align-items: center;}
    .warning-box { border: 1px solid rgba(245, 158, 11, 0.4); background: var(--warning-bg); color: var(--warning); }
    .error-box { border: 1px solid rgba(239, 68, 68, 0.4); background: var(--danger-bg); color: var(--danger); justify-content: center; margin-top: 20px;}
    
    .loading-spinner { display: inline-block; width: 22px; height: 22px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .section-title { font-size: 20px; font-weight: 700; margin: 30px 0 16px; color: #fff; display: flex; align-items: center; gap: 10px;}
    .section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, var(--border), transparent); }
    
    .toggle-header { cursor: pointer; user-select: none; transition: 0.2s; justify-content: space-between; }
    .toggle-header:hover { color: #fff !important; }
    .toggle-icon { font-size: 16px; transition: transform 0.3s ease; }
    .toggle-icon.open { transform: rotate(180deg); }

    .swap-container { position: relative; display: flex; align-items: center; overflow: hidden; }
    .swap-container > span { display: flex; align-items: center; height: 100%; white-space: nowrap; transition: opacity 0.2s ease; }
    .view-full { position: absolute; top: 0; left: 0; width: max-content; max-width: 100%; overflow: hidden; text-overflow: ellipsis; opacity: 0; pointer-events: none; font-size: 9px; }
    .view-short { opacity: 1; pointer-events: auto; }
    .group-card:hover .swap-container.has-marquee { width: max-content; max-width: 100%; }
    .group-card:hover .swap-container.has-marquee .view-short { display: none; }
    .group-card:hover .swap-container.has-marquee .view-full { position: static; opacity: 1; pointer-events: auto; }

    @keyframes name-marquee {
      0%, 20% { transform: translateX(0); }
      80%, 100% { transform: translateX(calc(-1 * var(--name-shift))); }
    }

    @media (max-width: 768px) {
      .form-row { grid-template-columns: 1fr; gap: 12px; }
      .input-card { padding: 25px; }
      .btn-check { width: 100%; height: 50px; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .group-card { padding: 12px 10px; flex-direction: column; align-items: center; text-align: center; }
      .group-card::before { width: 100%; height: 4px; top: 0; left: 0; border-radius: 16px 16px 0 0; }
      .group-card img { margin-bottom: 2px;}
      .group-card .g-info { align-items: center; width: 100%;}
      .group-card .g-name { font-size: 13px; white-space: normal; line-height: 1.3; margin-bottom: 4px; justify-content: center;}
      .g-payout { text-align: center;}
    }

    @media (max-width: 480px) {
      .wrap { padding-top: 16px; }
      .input-card { padding: 18px 14px; border-radius: 18px; }
      .header-text h1 { font-size: 28px; }
      .header-text p { font-size: 13px; }
      .grid { grid-template-columns: 1fr; gap: 12px; }
      .group-card { flex-direction: row; align-items: flex-start; text-align: left; padding: 14px 12px; }
      .group-card::before { width: 4px; height: 100%; top: 0; left: 0; border-radius: 16px 0 0 16px; }
      .group-card img { width: 48px; height: 48px; margin: 0; }
      .group-card .g-info { align-items: flex-start; }
      .group-card .g-name { font-size: 14px; white-space: nowrap; justify-content: flex-start; }
      .g-payout { max-width: 100%; }
      .summary { gap: 8px; }
      .pill { flex: 1 1 100%; justify-content: center; padding: 9px 12px; font-size: 12px; }
      .section-title { font-size: 17px; }
    }

    @media (hover: none) {
      .group-card:hover { transform: none; }
      .btn-check:hover, .pill:hover { transform: none; }
    }

    /* Visual system */

      --bg: #08070a;
      --card-bg: rgba(22, 14, 20, 0.92);
      --input-bg: #100b0f;
      --border: rgba(255, 190, 220, 0.16);
      --border-focus: #ff9fc8;

      --text-muted: #b5a5ae;

    body {

      background-size: cover;
      background-position: center;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      padding: 0 24px 80px;
    }

    body::before { content: ''; position: fixed; inset: 0; pointer-events: none; background: linear-gradient(115deg, transparent 0 48%, rgba(255, 159, 200, 0.04) 48.2% 48.35%, transparent 48.5%); }
    .wrap { max-width: 1160px; min-height: calc(100dvh - 80px); margin: 0 auto; padding-top: 112px; padding-bottom: 24px; display: flex; flex-direction: column; }
    .admin-link { position: fixed; top: 24px; right: 28px; display: flex; align-items: center; gap: 7px; background: rgba(14, 9, 13, 0.86); color: var(--text-muted); padding: 9px 14px; border-radius: 10px; text-decoration: none; font-size: 12px; font-weight: 700; border: 1px solid var(--border); backdrop-filter: blur(16px); transition: color .2s, border-color .2s, background .2s; z-index: 100; }

    .eyebrow span { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 0 5px rgba(255,159,200,.14); }
    .header-text h1 { font-family: 'Space Grotesk', sans-serif; font-size: clamp(48px, 8vw, 86px); line-height: .95; letter-spacing: -.07em; color: var(--text); background: none; -webkit-text-fill-color: initial; margin-bottom: 18px; }
    .header-text p { color: #aab9aa; font-size: clamp(15px, 2vw, 18px); max-width: 540px; line-height: 1.6; margin: 0; }

  <main class="wrap">
    <div id="input-card" class="input-card">
      <div class="header-text">
        <div class="eyebrow"><span></span> Roblox membership intelligence</div>
        <h1>Ro-Check</h1>
        <p>Discover your group memberships, join dates, and payout eligibility instantly.</p>
      </div>
      
      <div class="form-row">
        <div class="input-group">
          <label>Player Username or ID</label>
          <div class="input-wrapper">
            <input id="username" placeholder="Username or ID" autocomplete="off" oninput="handleInput('username')" onkeydown="if (event.key === 'Enter') check()">
            <button class="clear-btn" id="clear-username" onclick="clearField('username')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
        </div>
        
        <div class="input-group">
          <label>Custom Group <span class="badge">Optional</span></label>
          <div class="input-wrapper">
            <input id="customGroup" placeholder="Link or ID (Blank for default)" autocomplete="off" oninput="handleInput('customGroup')" onkeydown="if (event.key === 'Enter') check()">
            <button class="clear-btn" id="clear-customGroup" onclick="clearField('customGroup')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
        </div>

        <button id="check" class="btn-check" onclick="check()">
          <span id="btn-text">Check Now</span>
          <div id="btn-spinner" class="loading-spinner" style="display: none;"></div>
        </button>
      </div>
    </div>
    
    <div id="sticky-profile" class="sticky-profile"></div>
    <div id="out"></div>
    <footer class="rokit-footer">
      <a class="rokit-footer-link" href="https://rokit.vercel.app/" target="_blank" rel="noopener noreferrer">Want more Roblox utilities? Explore RoKit <span aria-hidden="true">-&gt;</span></a>
    </footer>
  </main>

  <script>
    const $ = s => document.querySelector(s);
    const out = $('#out');
    const stickyProfile = $('#sticky-profile');
    const btn = $('#check');
    const btnText = $('#btn-text');
    const btnSpinner = $('#btn-spinner');
    const inputCard = $('#input-card');

    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = sessionStorage.getItem('roblox_username');
      const savedGroup = sessionStorage.getItem('roblox_customGroup');
      if (savedUser) {
        $('#username').value = savedUser;
        toggleClearBtn('username');
        if (savedGroup) {
          $('#customGroup').value = savedGroup;
          toggleClearBtn('customGroup');
        }
        check(); 
      }
    });

    function handleInput(id) {
      sessionStorage.setItem('roblox_' + id, $('#' + id).value.trim());
      toggleClearBtn(id);
      if (id === 'username' && $('#username').value.trim() === '') resetUI();
    }

    function clearField(id) {
      const el = $('#' + id);
      el.value = '';
      sessionStorage.removeItem('roblox_' + id);
      toggleClearBtn(id);
      if (id === 'username') resetUI();
      if (id === 'customGroup' && $('#username').value.trim() !== '') check();
      el.focus();
    }

    function toggleClearBtn(id) {
      const btn = $('#clear-' + id);
      btn.style.display = $('#' + id).value.trim() !== '' ? 'flex' : 'none';
    }

    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    window.scrollToSection = function(id) {
      const el = document.getElementById(id);
      if (el) {
        const profileHeight = stickyProfile.getBoundingClientRect().height || 0;
        const targetPosition = el.getBoundingClientRect().top + window.pageYOffset;
        window.scrollTo({ top: targetPosition - profileHeight - 15, behavior: 'smooth' });
      }
    };

    function resetUI() { out.innerHTML = ''; stickyProfile.innerHTML = ''; inputCard.classList.remove('compact'); }

    window.checkCustomGroup = function(groupId) {
      $('#customGroup').value = groupId;
      handleInput('customGroup');
      check();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.filterGroups = function() {
      const q = $('#group-search').value.toLowerCase();
      document.querySelectorAll('.result-container .group-card').forEach(card => {
        const name = card.querySelector('.g-name').innerText.toLowerCase();
        card.style.display = name.includes(q) ? 'flex' : 'none';
      });

      ['section-joined', 'section-not-joined', 'section-other'].forEach(id => {
        const sec = document.getElementById(id);
        if(sec) {
          const nextGrid = sec.nextElementSibling;
          if (nextGrid && nextGrid.classList.contains('grid')) {
            const visibleCount = nextGrid.querySelectorAll('.group-card[style="display: flex;"], .group-card:not([style*="display: none"])').length;
            sec.style.display = visibleCount ? 'flex' : 'none';
          }
        }
      });
    };

    window.toggleOtherGroups = function() {
      const grid = document.getElementById('other-groups-grid');
      const icon = document.getElementById('other-toggle-icon');
      if (grid.style.display === 'none') {
        grid.style.display = 'grid';
        icon.classList.add('open');
        setTimeout(() => { window.scrollToSection('section-other'); }, 100);
      } else {
        grid.style.display = 'none';
        icon.classList.remove('open');
      }
    };

    function render(d) {
      let joined = d.groups.filter(g => g.joined);
      joined.sort((a, b) => new Date(b.joinedAt) - new Date(a.joinedAt)); 

      let no = d.groups.filter(g => !g.joined);

      stickyProfile.innerHTML = `
        <div class="user-profile">
          <img src="${d.user.avatar}" alt="Avatar" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\'></svg>'">
          <div><p class="u-name">${esc(d.user.displayName)} <a class="profile-link" href="https://www.roblox.com/users/${d.user.id}/profile" target="_blank" rel="noopener noreferrer" aria-label="Open @${esc(d.user.name)} Roblox profile" title="Open Roblox profile">(@${esc(d.user.name)}) <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7"></path><path d="M10 14 21 3"></path><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"></path></svg></a></p><p class="u-id">User ID: ${d.user.id}</p></div>
        </div>
      `;

      let html = `<div class="result-container" id="scroll-target">`;
      html += `
        <div class="search-box">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input id="group-search" type="text" placeholder="Search across all groups..." onkeyup="filterGroups()" autocomplete="off">
        </div>
      `;
      html += `
        <div class="summary">
          <div class="pill ok" onclick="scrollToSection('section-joined')"><span class="icon-ok">✓</span> JOINED ${d.joinedCount}/${d.total}</div>
          <div class="pill no" onclick="scrollToSection('section-not-joined')"><span class="icon-no">✗</span> NOT JOINED ${d.total - d.joinedCount}/${d.total}</div>
        </div>
      `;
      if (d.dateWarning) html += `<div class="warning-box"><span>⚠️</span> ${esc(d.dateWarning)}</div>`;

      const renderCard = (g, isJoined) => {
        let payoutHtml = '';
        if (isJoined && g.joinedAt !== null) {
          if (g.payoutEligible) {
            payoutHtml = `<div class="g-payout ok">✓ Eligible for payout</div>`;
          } else {
            const joinDate = new Date(g.joinedAt);
            const eligibleDate = new Date(joinDate.getTime() + 14 * 24 * 60 * 60 * 1000);
            const dStr = eligibleDate.toLocaleString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const tStr = eligibleDate.toLocaleString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const diff = eligibleDate - new Date();
            let remainStr = "", daysLeftText = "0 days";
            
            if (diff > 0) {
              const d = Math.floor(diff / (1000 * 60 * 60 * 24)), h = Math.floor((diff / (1000 * 60 * 60)) % 24);
              remainStr = d > 0 ? `(in ${d}d ${h}h)` : `(in ${h}h)`;
              const totalDaysLeft = Math.ceil(diff / (1000 * 60 * 60 * 24));
              daysLeftText = totalDaysLeft > 1 ? `${totalDaysLeft} days` : `1 day`;
            }
            
              payoutHtml = `<div class="g-payout wait swap-container"><span class="view-short">⏳ Ineligible (${daysLeftText} left)</span><span class="view-full">⏳ ${dStr} ${tStr} ${remainStr}</span></div>`;
          }
        }
        
        let joinedText = 'Join date unavailable';
        if (isJoined && g.joinedAt) {
            const jDate = new Date(g.joinedAt);
            const dStr = jDate.toLocaleString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const tStr = jDate.toLocaleString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            joinedText = `Joined: ${dStr}<br>${tStr} ${g.ago ? `(${esc(g.ago)})` : ''}`;
        }
        
        const groupUrl = `https://www.roblox.com/communities/${g.id}`;
        
        return `
          <a href="${groupUrl}" target="_blank" rel="noopener" class="group-card ${isJoined ? 'is-joined' : 'not-joined'}">
            <img src="${g.icon}" alt="Group" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\'></svg>'">
            <div class="g-info">
              <div class="g-name"><span class="${isJoined ? 'icon-ok' : 'icon-no'}">${isJoined ? '✓' : '✗'}</span> <span class="name-text">${esc(g.name)}</span></div>
              <div class="g-meta" style="line-height: 1.4;">${isJoined ? joinedText : 'Not a member <br><span class="join-now">Join now ➔</span>'}</div>
              ${payoutHtml}
            </div>
          </a>
        `;
      };

      if (d.isCustom) {
         html += `<div class="grid">${d.groups.map(g => renderCard(g, g.joined)).join('')}</div>`;
      } else {
         if (joined.length) html += `<div id="section-joined" class="section-title">Joined Groups</div><div class="grid">${joined.map(g => renderCard(g, true)).join('')}</div>`;
         if (no.length) html += `<div id="section-not-joined" class="section-title" style="margin-top: 40px;">Not Joined</div><div class="grid" style="opacity: 0.9;">${no.map(g => renderCard(g, false)).join('')}</div>`;
      }
      html += `</div>`;
      out.innerHTML = html;
      setupNameMarquees(out);
      setupPayoutMarquees(out);
    }

    function setupNameMarquees(root) {
      root.querySelectorAll('.g-name').forEach(name => {
        const text = name.querySelector('.name-text');
        if (!text) return;
        const availableWidth = name.clientWidth - text.offsetLeft;
        if (text.scrollWidth <= availableWidth) return;
        name.classList.add('is-marquee');
        name.style.setProperty('--name-shift', `${text.scrollWidth - availableWidth}px`);
      });
    }

    function setupPayoutMarquees(root) {
      root.querySelectorAll('.swap-container').forEach(container => {
        if (!container.querySelector('.view-full')) return;
        container.classList.add('has-marquee');
      });
    }

    async function loadOtherGroups(userId, monitoredGroups) {
      try {
        const monitoredIds = monitoredGroups.map(g => g.id.toString());
        const res = await fetch(`https://groups.roproxy.com/v1/users/${userId}/groups/roles`);
        if (!res.ok) return;
        const data = await res.json();
        const otherGroups = (data.data || []).filter(g => !monitoredIds.includes(g.group.id.toString()));
        
        if (otherGroups.length > 0) {
          const container = document.createElement('div');
          
          let html = `
            <div id="section-other" class="section-title toggle-header" onclick="toggleOtherGroups()" style="margin-top: 40px; color: #e0b8cb;">
              <span>Other Groups (${otherGroups.length})</span>
              <svg id="other-toggle-icon" class="toggle-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
            <div id="other-groups-grid" class="grid" style="display: none; opacity: 0.75;">
          `;
          
          html += otherGroups.map(g => `
            <div onclick="checkCustomGroup('${g.group.id}')" class="group-card is-joined" style="align-items: center; padding: 12px; cursor: pointer;">
              <img src="https://tr.rbxcdn.com/default-group-icon" data-other-id="${g.group.id}" class="other-group-icon" alt="Group" style="width: 45px; height: 45px; border-radius: 10px; margin-right: 12px; margin-bottom: 0;">
              <div class="g-info">
                <div class="g-name" style="font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #f0d5e1;"><span class="name-text">${esc(g.group.name)}</span></div>
                <div class="g-meta" style="color: #b895a7;">Role: ${esc(g.role.name)}</div>
              </div>
            </div>
          `).join('');
          html += `</div>`;
          container.innerHTML = html;
          setupNameMarquees(container);
          setupPayoutMarquees(container);
          
          const target = document.getElementById('scroll-target');
          if (target) target.appendChild(container);
          if ($('#group-search') && $('#group-search').value.trim() !== '') filterGroups();

          const ids = otherGroups.map(g => g.group.id);
          for (let i = 0; i < ids.length; i += 10) {
            const chunk = ids.slice(i, i + 10);
            fetch(`https://thumbnails.roproxy.com/v1/groups/icons?groupIds=${chunk.join(',')}&size=150x150&format=Png&isCircular=false`)
              .then(r => r.json())
              .then(d => {
                if(d.data) d.data.forEach(item => {
                  const img = document.querySelector(`.other-group-icon[data-other-id="${item.targetId}"]`);
                  if(img) img.src = item.imageUrl;
                });
              }).catch(()=>{});
            await new Promise(r => setTimeout(r, 500));
          }
        }
      } catch (e) { console.error("Error loading other groups", e); }
    }

    async function check() {
      const username = $('#username').value.trim();
      const customGroup = $('#customGroup').value.trim();
      if (!username) { $('#username').focus(); return; }

      btn.disabled = true; btnText.innerText = 'Checking '; btnSpinner.style.display = 'inline-block';
      out.innerHTML = ''; stickyProfile.innerHTML = ''; 

      try {
        const r = await fetch('/api/index', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, customGroup }) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'Request failed');
        
        inputCard.classList.add('compact');
        render(d);
        setTimeout(() => { window.scrollToSection('scroll-target'); }, 550);
        if (!customGroup) loadOtherGroups(d.user.id, d.groups);

      } catch (e) {
        out.innerHTML = `<div class="error-box"><b>Error:</b> ${esc(e.message)}</div>`;
        inputCard.classList.remove('compact');
      } finally {
        btn.disabled = false; btnText.innerText = 'Check Now'; btnSpinner.style.display = 'none';
      }
    }

  </script>
</body>
</html>
