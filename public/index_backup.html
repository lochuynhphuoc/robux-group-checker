<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roblox Group Checker</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --card-bg: rgba(17, 24, 39, 0.35);
      --input-bg: rgba(0, 0, 0, 0.4);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: #58a6ff;
      --text: #e5e7eb;
      --text-muted: #9ca3af;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-glow: rgba(37, 99, 235, 0.5);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.1);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.1);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.1);
    }
    
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #4b5563; }

    * { box-sizing: border-box; }
    body { 
      margin: 0; background-color: var(--bg);
      background-image: radial-gradient(ellipse at 50% -20%, #1e3a8a 0%, var(--bg) 50%);
      background-attachment: fixed; color: var(--text); 
      font-family: 'Inter', sans-serif; line-height: 1.5; padding: 0 20px 60px; 
    }
    
    .wrap { max-width: 1100px; margin: 0 auto; padding-top: 30px; }
    
    .input-card {
      background: var(--card-bg); 
      backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--border); border-radius: 24px; padding: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      margin-bottom: 25px; 
    }

    .input-card.compact {
      padding: 15px 25px; border-radius: 16px; background: rgba(17, 24, 39, 0.5);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }
    
    .header-text { text-align: center; margin-bottom: 30px; transition: all 0.4s ease; overflow: hidden; opacity: 1; }
    .header-text h1 { 
      margin: 0; font-size: 38px; font-weight: 800; letter-spacing: -1px;
      background: linear-gradient(135deg, #fff 0%, #93c5fd 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(147, 197, 253, 0.2));
    }
    .header-text p { color: var(--text-muted); margin: 8px 0 0; font-size: 16px; }
    .input-card.compact .header-text { max-height: 0; margin-bottom: 0; opacity: 0; transform: translateY(-10px) scale(0.95); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 15px; align-items: end; transition: all 0.4s ease; }
    
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    .input-group label { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; color: #e5e7eb; transition: all 0.3s; }
    .badge { font-size: 10px; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 12px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;}
    
    .input-card.compact .input-group label { font-size: 12px; margin-bottom: -2px; color: var(--text-muted); }
    .input-card.compact .badge { display: none; }

    .form-row input {
      width: 100%; background: var(--input-bg); color: #fff; border: 1px solid var(--border);
      border-radius: 12px; padding: 15px 18px; font-size: 15px; font-family: inherit; transition: all 0.3s;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }
    .form-row input:focus { outline: none; border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2), inset 0 2px 4px rgba(0,0,0,0.2); background: rgba(0, 0, 0, 0.6);}
    .input-card.compact .form-row input { padding: 12px 16px; font-size: 14px; }

    .btn-check {
      background: linear-gradient(135deg, var(--primary), #3b82f6); color: #fff; border: none; border-radius: 12px;
      padding: 0 25px; height: 52px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s;
      display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 8px 15px var(--primary-glow);
    }
    .btn-check:hover { transform: translateY(-2px); box-shadow: 0 12px 20px var(--primary-glow); filter: brightness(1.1); }
    .btn-check:active { transform: translateY(0); box-shadow: 0 4px 10px var(--primary-glow); }
    .btn-check:disabled { opacity: 0.7; cursor: not-allowed; transform: none; box-shadow: none; filter: grayscale(0.5); }
    .input-card.compact .btn-check { height: 45px; padding: 0 20px; font-size: 14px;}

    .sticky-profile {
      position: sticky; top: 15px; z-index: 999;
    }
    
    .user-profile { 
      display: flex; align-items: center; gap: 15px; padding: 12px 25px; 
      background: rgba(17, 24, 39, 0.55); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      animation: fadeInProfile 0.4s ease-out;
      margin-bottom: 20px;
    }
    @keyframes fadeInProfile { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .user-profile img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); background: var(--input-bg); }
    .user-profile .u-name { font-size: 18px; font-weight: 800; color: #fff; margin: 0; letter-spacing: -0.5px;}
    .user-profile .u-id { color: var(--text-muted); font-size: 13px; margin: 2px 0 0; font-weight: 500; }

    .result-container { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    
    .summary { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 25px; }
    
    .pill { 
      padding: 10px 20px; border-radius: 999px; font-size: 14px; font-weight: 700; 
      display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      cursor: pointer; transition: all 0.2s ease; user-select: none;
      backdrop-filter: blur(10px);
    }
    .pill:hover { transform: translateY(-3px); filter: brightness(1.15); box-shadow: 0 6px 15px rgba(0,0,0,0.3); }
    .pill:active { transform: translateY(0); }
    .pill.ok { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
    .pill.no { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
    
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    
    .group-card {
      background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border); border-radius: 16px;
      padding: 16px; display: flex; align-items: flex-start; gap: 14px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none; color: inherit; position: relative; overflow: hidden;
    }
    .group-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: transparent; transition: 0.3s; }
    .group-card.is-joined::before { background: var(--success); }
    .group-card.not-joined::before { background: var(--danger); }
    
    .group-card:hover { border-color: rgba(255,255,255,0.15); transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.4); background: rgba(255,255,255,0.08); }
    .group-card img { width: 55px; height: 55px; border-radius: 12px; object-fit: cover; background: rgba(0,0,0,0.5); box-shadow: 0 4px 10px rgba(0,0,0,0.3);}
    .group-card .g-info { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 4px; }
    .group-card .g-name { font-weight: 700; color: #fff; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px;}
    .group-card .g-meta { font-size: 12px; color: var(--text-muted); font-weight: 500;}
    
    .g-payout { font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 6px; width: fit-content; margin-top: 6px; letter-spacing: 0.2px;}
    .g-payout.ok { background: var(--success-bg); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
    .g-payout.wait { background: var(--warning-bg); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
    
    .join-now { color: #60a5fa; font-weight: 700; display: inline-block; margin-top: 6px; padding: 4px 10px; background: rgba(96, 165, 250, 0.1); border-radius: 6px; transition: 0.2s;}
    .group-card:hover .join-now { background: rgba(96, 165, 250, 0.2); color: #93c5fd; }
    
    .icon-ok { color: var(--success); font-weight: 900; }
    .icon-no { color: var(--danger); font-weight: 900; }
    
    .warning-box { padding: 16px 20px; border: 1px solid rgba(245, 158, 11, 0.4); background: var(--warning-bg); color: var(--warning); border-radius: 12px; margin-bottom: 25px; font-size: 15px; font-weight: 500; display: flex; gap: 10px; align-items: center;}
    .error-box { padding: 16px 20px; border: 1px solid rgba(239, 68, 68, 0.4); background: var(--danger-bg); color: var(--danger); border-radius: 12px; margin-top: 20px; font-size: 15px; font-weight: 500; text-align: center;}
    
    .loading-spinner { display: inline-block; width: 22px; height: 22px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .section-title { font-size: 20px; font-weight: 700; margin: 30px 0 16px; color: #fff; display: flex; align-items: center; gap: 10px;}
    .section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, var(--border), transparent); }

    @media (max-width: 768px) {
      .form-row { grid-template-columns: 1fr; gap: 12px; }
      .input-card { padding: 25px; }
      .header-text h1 { font-size: 30px; }
      .btn-check { width: 100%; height: 50px; }
      .input-card.compact .form-row { gap: 10px; }
      .input-card.compact .btn-check { height: 45px; }
      
      .user-profile { padding: 10px 18px; }
      .user-profile img { width: 42px; height: 42px; }
      .user-profile .u-name { font-size: 16px; }
      .user-profile .u-id { font-size: 12px; margin-top: 0; }
      
      .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      
      .group-card { 
        padding: 12px 10px; gap: 10px; 
        flex-direction: column;
        align-items: center; text-align: center; 
      }
      .group-card::before { width: 100%; height: 4px; top: 0; left: 0; }
      .group-card img { width: 45px; height: 45px; margin-bottom: 2px;}
      
      .group-card .g-info { align-items: center; width: 100%;}
      .group-card .g-name { font-size: 13px; white-space: normal; line-height: 1.3; margin-bottom: 4px; justify-content: center;}
      .group-card .g-meta { font-size: 11px; }
      
      .g-payout { font-size: 10px; padding: 4px 6px; text-align: center; margin-top: 6px; width: 100%; }
      .join-now { font-size: 11px; padding: 4px 8px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    
    <div id="input-card" class="input-card">
      <div class="header-text">
        <h1>Ro-Check</h1>
        <p>Verify Roblox group memberships, join dates, and payout eligibility instantly.</p>
      </div>
      
      <div class="form-row">
        <div class="input-group">
          <label>Player Username or ID</label>
          <input id="username" placeholder="Username or ID" autocomplete="off">
        </div>
        
        <div class="input-group">
          <label>Custom Group <span class="badge">Optional</span></label>
          <input id="customGroup" placeholder="Link or ID (Blank for default)" autocomplete="off">
        </div>

        <button id="check" class="btn-check">
          <span id="btn-text">Check Now</span>
          <div id="btn-spinner" class="loading-spinner" style="display: none;"></div>
        </button>
      </div>
    </div>
    
    <div id="sticky-profile" class="sticky-profile"></div>
      
    <div id="out"></div>
    
  </main>

  <script>
    const $ = s => document.querySelector(s);
    const out = $('#out');
    const stickyProfile = $('#sticky-profile');
    const btn = $('#check');
    const btnText = $('#btn-text');
    const btnSpinner = $('#btn-spinner');
    const inputCard = $('#input-card');

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    window.scrollToSection = function(id) {
      const el = document.getElementById(id);
      if (el) {
        const profileHeight = stickyProfile.getBoundingClientRect().height || 0;
        const targetPosition = el.getBoundingClientRect().top + window.pageYOffset;
        window.scrollTo({ 
          top: targetPosition - profileHeight - 15, 
          behavior: 'smooth' 
        });
      }
    };

    function resetUI() {
      out.innerHTML = '';
      stickyProfile.innerHTML = '';
      inputCard.classList.remove('compact');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    $('#username').addEventListener('input', (e) => {
      if (e.target.value.trim() === '') {
        resetUI();
      }
    });

    function render(d) {
      let joined = d.groups.filter(g => g.joined);
      let no = d.groups.filter(g => !g.joined);

      stickyProfile.innerHTML = `
        <div class="user-profile">
          <img src="${d.user.avatar}" alt="Avatar" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\'></svg>'">
          <div>
            <p class="u-name">${esc(d.user.displayName)} <span style="color:var(--text-muted); font-size:15px; font-weight:600;">(@${esc(d.user.name)})</span></p>
            <p class="u-id">User ID: ${d.user.id}</p>
          </div>
        </div>
      `;

      let html = `<div class="result-container" id="scroll-target">`;
      
      html += `
        <div class="summary">
          <div class="pill ok" onclick="scrollToSection('section-joined')" title="Scroll to Joined Groups">
            <span class="icon-ok">✓</span> JOINED ${d.joinedCount}/${d.total}
          </div>
          <div class="pill no" onclick="scrollToSection('section-not-joined')" title="Scroll to Not Joined">
            <span class="icon-no">✗</span> NOT JOINED ${d.total - d.joinedCount}/${d.total}
          </div>
        </div>
      `;
      
      if (d.dateWarning) html += `<div class="warning-box"><span>⚠️</span> ${esc(d.dateWarning)}</div>`;

      const renderCard = (g, isJoined) => `
        <a href="${g.url}" target="_blank" rel="noopener" class="group-card ${isJoined ? 'is-joined' : 'not-joined'}">
          <img src="${g.icon}" alt="Group" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\'></svg>'">
          <div class="g-info">
            <div class="g-name">
              <span class="${isJoined ? 'icon-ok' : 'icon-no'}">${isJoined ? '✓' : '✗'}</span> 
              ${esc(g.name)}
            </div>
            <div class="g-meta">
              ${isJoined 
                ? (g.joinedAt ? `Joined: ${new Date(g.joinedAt).toLocaleString('en-GB')} ${g.ago ? `(${esc(g.ago)})` : ''}` : 'Join date unavailable')
                : 'Not a member <br><span class="join-now">Join now ➔</span>'}
            </div>
            ${isJoined && g.joinedAt !== null ? `
              <div class="g-payout ${g.payoutEligible ? 'ok' : 'wait'}">
                ${g.payoutEligible ? '✓ Eligible for payout' : '⏳ Ineligible (< 14 days)'}
              </div>
            ` : ''}
          </div>
        </a>
      `;

      if (d.isCustom) {
         html += `<div class="grid">${d.groups.map(g => renderCard(g, g.joined)).join('')}</div>`;
      } else {
         if (joined.length) {
            html += `<div id="section-joined" class="section-title">Joined Groups</div><div class="grid">${joined.map(g => renderCard(g, true)).join('')}</div>`;
         }
         if (no.length) {
            html += `<div id="section-not-joined" class="section-title" style="margin-top: 40px;">Not Joined</div><div class="grid" style="opacity: 0.9;">${no.map(g => renderCard(g, false)).join('')}</div>`;
         }
      }

      html += `</div>`;
      out.innerHTML = html;
    }

    async function check() {
      const username = $('#username').value.trim();
      const customGroup = $('#customGroup').value.trim();
      
      if (!username) {
        $('#username').focus();
        return;
      }

      btn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline-block';
      out.innerHTML = '';
      stickyProfile.innerHTML = ''; 

      try {
        const r = await fetch('/api/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, customGroup })
        });
        const d = await r.json();
        
        if (!r.ok) throw new Error(d.error || 'Request failed');
        
        inputCard.classList.add('compact');
        render(d);

        setTimeout(() => {
          window.scrollToSection('scroll-target');
        }, 550);

      } catch (e) {
        out.innerHTML = `<div class="error-box"><b>Error:</b> ${esc(e.message)}</div>`;
        inputCard.classList.remove('compact');
      } finally {
        btn.disabled = false;
        btnText.style.display = 'inline-block';
        btnSpinner.style.display = 'none';
      }
    }

    $('#check').onclick = check;
    $('#username').onkeydown = e => { if (e.key === 'Enter') check(); };
    $('#customGroup').onkeydown = e => { if (e.key === 'Enter') check(); };
  </script>
</body>
</html>
