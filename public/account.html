<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account - Ro-Check</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #080608; --card: rgba(32, 16, 28, .76); --border: rgba(255, 159, 200, .2); --text: #f3eaf0; --muted: #b7a9b2; --pink: #ff9fc8; --danger: #ff9a8b; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; color: var(--text); font-family: 'DM Sans', sans-serif; background: radial-gradient(ellipse at 50% -20%, #482038 0%, var(--bg) 58%); }
    .card { width: min(100%, 440px); padding: 34px; border: 1px solid var(--border); border-radius: 22px; background: var(--card); box-shadow: 0 24px 70px rgba(0,0,0,.4); }
    .eyebrow { color: var(--pink); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 12px 0 8px; font: 700 34px/1 'Space Grotesk', sans-serif; }
    .intro { margin: 0 0 26px; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 5px; margin-bottom: 22px; border-radius: 11px; background: rgba(0,0,0,.28); }
    .tab { border: 0; border-radius: 8px; padding: 10px; color: var(--muted); background: transparent; font: inherit; font-weight: 700; cursor: pointer; }
    .tab.active { color: #28131e; background: var(--pink); }
    label { display: block; margin: 14px 0 7px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 50px; }
    .password-toggle { position: absolute; top: 0; right: 0; width: 48px; height: 46px; padding: 0; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
    .password-toggle:hover { color: var(--pink); }
    .password-toggle svg { width: 19px; height: 19px; }
    input { width: 100%; height: 46px; padding: 0 13px; border: 1px solid var(--border); border-radius: 10px; color: var(--text); background: rgba(0,0,0,.32); font: inherit; }
    input:focus { outline: 0; border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255,159,200,.1); }
    .form-actions { display: block; margin-top: 22px; }
    .submit { width: 100%; height: 46px; border: 0; border-radius: 10px; color: #28131e; background: var(--pink); font: inherit; font-weight: 700; cursor: pointer; }
    .submit:disabled { opacity: .65; cursor: wait; }
    .message { min-height: 20px; margin: 14px 0 0; color: var(--muted); font-size: 13px; text-align: center; }
    .message.error { color: var(--danger); }
    .message.success { color: var(--pink); }
    .privacy { margin-top: 24px; color: var(--muted); font-size: 11px; line-height: 1.5; text-align: center; }
    .back-home { display: inline-flex; align-items: center; justify-content: center; gap: 7px; width: 100%; height: 40px; margin-top: 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 10px; text-decoration: none; font-size: 13px; font-weight: 700; }
    .back-home:hover { color: var(--pink); }
    .signed-in { text-align: center; }
    .signed-in[hidden] { display: none; }
    .signed-in p { color: var(--muted); line-height: 1.5; }
    .manager-link, .logout-button { display: inline-flex; align-items: center; justify-content: center; width: 100%; height: 42px; margin-top: 10px; border: 1px solid var(--border); border-radius: 10px; color: var(--pink); background: rgba(255,159,200,.1); font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    @media (max-width: 520px) { body { padding: 18px; } .card { padding: 26px 20px; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Ro-Check account</div>
    <h1 id="title">Welcome back</h1>
    <p class="intro" id="intro">Log in to load your saved group lists and check them quickly with any Roblox username.</p>
    <div class="tabs">
      <button class="tab active" id="login-tab" onclick="setMode('login')">Log in</button>
      <button class="tab" id="register-tab" onclick="setMode('register')">Register</button>
    </div>
    <div id="signed-in" class="signed-in" hidden>
      <p>You are signed in as <strong id="signed-in-name"></strong>.</p>
      <a class="manager-link" href="/groups.html">Open Groups Manager</a>
      <button class="logout-button" type="button" onclick="logout()">Logout</button>
    </div>
    <form id="account-form">
      <label for="username">Account username</label>
      <input id="username" autocomplete="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+">
      <label for="password">Password</label>
      <div class="password-wrap">
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        <button class="password-toggle" type="button" aria-label="Show password" title="Show password" onclick="togglePassword('password', this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
      <div id="repeat-password-field" hidden>
        <label for="repeat-password">Repeat password</label>
        <div class="password-wrap">
          <input id="repeat-password" name="repeat-password" type="password" autocomplete="off" minlength="8" maxlength="128">
          <button class="password-toggle" type="button" aria-label="Show repeated password" title="Show repeated password" onclick="togglePassword('repeat-password', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>
      <p class="message" id="message" role="status"></p>
      <div class="form-actions">
        <button class="submit" id="submit" type="submit">Log in</button>
        <a class="back-home" href="/">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          Back to Homepage
        </a>
      </div>
    </form>
    <p class="privacy">Your password is stored as a salted hash. An account is optional; guests can still use the checker.</p>
  </main>
  <script>
    let mode = 'login';
    const $ = id => document.getElementById(id);
    async function checkSession() {
      try {
        const response = await fetch('/api/auth?action=me', { credentials: 'same-origin' });
        const data = await readJson(response);
        if (!data.user) return;
        $('title').textContent = 'Account ready';
        $('intro').textContent = 'Your session is active. Manage your saved Roblox groups or return to the checker.';
        $('login-tab').parentElement.hidden = true;
        $('account-form').hidden = true;
        $('signed-in-name').textContent = data.user.username;
        $('signed-in').hidden = false;
      } catch (error) {
        console.warn('Could not restore account session:', error.message);
      }
    }
    async function logout() {
      await fetch('/api/auth?action=logout', { method: 'POST', credentials: 'same-origin' });
      localStorage.removeItem('rocheck_account_username');
      location.reload();
    }
    function setMode(nextMode) {
      mode = nextMode;
      $('login-tab').classList.toggle('active', mode === 'login');
      $('register-tab').classList.toggle('active', mode === 'register');
      $('title').textContent = mode === 'login' ? 'Welcome back' : 'Create your account';
      $('intro').textContent = mode === 'login'
        ? 'Log in to load your saved group lists and check them quickly with any Roblox username.'
        : 'Create an account to save group lists and reuse them on your next checks.';
      $('submit').textContent = mode === 'login' ? 'Log in' : 'Create account';
      $('password').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
      $('repeat-password-field').hidden = mode !== 'register';
      $('repeat-password').required = mode === 'register';
      $('message').textContent = '';
      $('message').className = 'message';
    }
    function togglePassword(id, button) {
      const input = $(id);
      const visible = input.type === 'text';
      input.type = visible ? 'password' : 'text';
      button.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
      button.title = visible ? 'Show password' : 'Hide password';
      button.innerHTML = visible
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle><path d="m3 3 18 18"></path></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    }
    async function readJson(response) {
      const text = await response.text();
      try { return JSON.parse(text); } catch { throw new Error(`Account service returned an invalid response (${response.status}).`); }
    }
    checkSession();
    $('account-form').addEventListener('submit', async event => {
      event.preventDefault();
      const message = $('message');
      if (mode === 'register' && $('password').value !== $('repeat-password').value) {
        message.className = 'message error';
        message.textContent = 'Passwords do not match.';
        return;
      }
      $('submit').disabled = true;
      message.textContent = 'Please wait...';
      try {
        const response = await fetch(`/api/auth?action=${mode}`, {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: $('username').value.trim(), password: $('password').value })
        });
        const data = await readJson(response);
        if (!response.ok) throw new Error(data.error || 'Account request failed.');
        localStorage.setItem('rocheck_account_username', data.user.username);
        message.className = 'message success';
        message.textContent = 'Success. Redirecting to the checker...';
        setTimeout(() => { window.location.href = '/'; }, 500);
      } catch (error) {
        message.className = 'message error';
        message.textContent = error.message;
      } finally {
        $('submit').disabled = false;
      }
    });
  </script>
</body>
</html>
